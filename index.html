<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AC3 Practice Simulator</title>
<style>
  :root{ --navy:#1E3A4C; --line:#000; --orange:#E35B27; --orange-dark:#B8461C; --blue-info:#1E3A4C; --green:#1F8A5E; --green-bg:#E7F6EF; --amber:#B98900; --amber-bg:#FFF6E0; --red:#B3261E; --red-bg:#FBEAEA; --muted:#5B6472; --linkblue:#2557A7; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#1B2333;padding:36px;font-size:13px;}
  .wrap{max-width:1180px;margin:0 auto;}
  .bar{background:var(--navy);color:#fff;border-radius:6px 6px 0 0;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .bar .left{display:flex;align-items:center;gap:10px;}
  .statusbox{background:#2A4A5F;border:1px solid #3E6178;border-radius:4px;padding:7px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:#fff;}
  .statusbox .dot{width:6px;height:6px;border-radius:50%;background:#9FD8C0;}
  .timer{font-size:11px;color:#CFE3EC;}
  .logo{width:34px;height:34px;border-radius:50%;border:1px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:default;background:transparent;color:#fff;}
  .logo.avail-dot{background:#1F8A5E;border-color:#1F8A5E;}
  .logo.ringing{cursor:pointer;animation:pulse 1s infinite;background:#1F8A5E;border-color:#1F8A5E;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5);}70%{box-shadow:0 0 0 8px rgba(255,255,255,0);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}
  .icons{display:flex;align-items:center;gap:32px;}
  .icons .ic{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#fff;cursor:pointer;}
  .icons .circ{width:30px;height:30px;border-radius:50%;border:1px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}

  .dropdown{background:#fff;border:1px solid #000;border-top:none;padding:4px 0;}
  .dropdown div{padding:8px 16px;font-size:12px;color:#000;cursor:pointer;}
  .dropdown div:hover{background:#f2f2f2;}

  .stage{background:#fff;border-left:1px solid var(--navy);border-right:1px solid var(--navy);border-bottom:1px solid var(--navy);border-radius:0 0 6px 6px;padding:28px 32px;min-height:220px;}

  .searchrow{display:flex;gap:10px;margin-bottom:12px;max-width:520px;}
  .searchrow input{flex:1;padding:10px 14px;border:1px solid #C7CCD3;border-radius:4px;font-size:13px;}
  .btn{padding:10px 18px;border-radius:4px;border:1px solid #C7CCD3;background:#fff;font-size:12.5px;cursor:pointer;font-weight:500;color:#1B2333;}
  .btn:hover{background:#f2f2f2;}
  .btn.primary{background:var(--orange);border:1px solid var(--orange);color:#fff;}
  .btn.primary:hover{background:var(--orange-dark);}
  .btn.small{padding:7px 12px;font-size:11.5px;}
  .link{color:var(--orange);text-decoration:none;font-size:12px;cursor:pointer;}
  .resultcount{font-size:12px;color:#1B2333;margin:6px 0;}

  .acctcard{border:2px solid #000;border-radius:6px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;max-width:520px;}
  .acctcard .check{width:20px;height:20px;border-radius:50%;border:1px solid #C7CCD3;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .acctcard.selected .check{background:var(--orange);border-color:var(--orange);color:#fff;}
  .acctcard .circ{width:40px;height:40px;border-radius:50%;background:#E9EBEF;display:flex;align-items:center;justify-content:center;color:#5B6472;}
  .acctcard .info b{font-size:13px;}
  .acctcard .info div{font-size:12px;color:#5B6472;}
  .status-pill{font-size:11px;font-weight:600;color:var(--orange);margin-left:auto;}

  .verifybox{border:1px solid #C7CCD3;border-radius:6px;padding:18px 22px;max-width:600px;}
  .verifybox ul{margin:8px 0 12px 16px;padding:0;font-size:12.5px;}
  .verifybox li{margin-bottom:3px;}
  .banner{border-radius:4px;padding:7px 9px;font-size:12px;margin-bottom:8px;border:1px solid #C7CCD3;}

  .infobox{background:var(--navy);color:#fff;border-radius:6px;padding:16px 20px;font-size:12px;margin-top:16px;line-height:1.6;max-width:600px;}
  .infobox b{color:#fff;}

  .prodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:16px;}
  .prodcard{border:1px solid #C7CCD3;border-radius:6px;padding:14px;cursor:pointer;text-align:center;}
  .prodcard:hover{border-color:var(--orange);}
  .prodcard .thumb{width:100%;height:64px;background:#F0F1F3;border-radius:4px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#5B6472;}
  .prodcard .pname{font-size:11.5px;font-weight:500;margin-bottom:3px;}
  .prodcard .pmeta{font-size:10.5px;color:#5B6472;margin-bottom:6px;}
  .tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:7px;}
  .tag.pending{background:var(--amber-bg);color:var(--amber);}
  .tag.delivered{background:var(--green-bg);color:var(--green);}

  table.orderinfo{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;max-width:600px;}
  table.orderinfo td{padding:5px 0;vertical-align:top;}
  table.orderinfo td.label{color:#5B6472;width:160px;}
  .track{display:flex;flex-direction:column;margin:16px 0;max-width:600px;}
  .trackstep{display:flex;gap:8px;align-items:flex-start;position:relative;padding-bottom:16px;}
  .trackstep:last-child{padding-bottom:0;}
  .trackstep .tdot{width:18px;height:18px;border-radius:50%;border:2px solid #C7CCD3;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;background:#fff;}
  .trackstep.done .tdot{border-color:var(--green);background:var(--green);color:#fff;}
  .trackstep:not(:last-child)::before{content:"";position:absolute;left:8px;top:18px;width:1px;height:100%;background:#C7CCD3;}
  .trackstep.done:not(:last-child)::before{background:var(--green);}
  .trackstep .label{font-size:12.5px;font-weight:500;}
  .trackstep .sub{font-size:11px;color:#5B6472;}

  .orderlink{color:var(--linkblue);text-decoration:underline;font-weight:600;font-size:14px;}
  .sectionhead{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:13px;margin:16px 0 4px;user-select:none;}
  .sectionhead .arrow{font-size:9px;color:#5B6472;display:inline-block;transition:transform .15s;}
  .sectionhead .arrow.open{transform:rotate(90deg);}
  .sectionbody{padding:8px 0 4px 16px;font-size:12.5px;color:#333;}
  .hr{border:none;border-top:1px solid #E1E4E9;margin:14px 0;}
  .twocol{display:flex;gap:28px;margin-top:12px;flex-wrap:wrap;}
  .twocol .col{flex:1;min-width:200px;font-size:12px;}
  .twocol .col .coltitle{color:#5B6472;font-size:11.5px;margin-bottom:6px;}
  .twocol .col .colrow{display:flex;align-items:center;gap:8px;}
  .twocol .col .colicon{width:22px;height:22px;border-radius:4px;background:#F0F1F3;display:flex;align-items:center;justify-content:center;font-size:11px;color:#5B6472;flex:none;}
  .updates-list{margin-top:10px;}
  .updates-list .u-date{font-size:12.5px;font-weight:600;color:var(--linkblue);margin-top:12px;}
  .updates-list .u-text{font-size:12px;color:#5B6472;margin-top:2px;}

  .actiongrid{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .resolvegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px;max-width:640px;}
  .giftcard{background:var(--green-bg);border:1px solid #A9DFC3;color:#175C3D;border-radius:4px;padding:8px 10px;font-size:12.5px;margin-top:8px;max-width:600px;}
  .hidden{display:none;}

  .center-controls{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .center-icons{display:flex;align-items:center;gap:26px;}
  .countdown{font-size:11px;color:#fff;margin-top:2px;}
  .resource-btn{width:30px;height:30px;border-radius:4px;border:1px solid #fff;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px;cursor:pointer;}
  .resource-btn span{width:3px;height:3px;background:#fff;border-radius:50%;}
  .resource-menu{position:absolute;right:28px;top:60px;background:#fff;border:1px solid #C7CCD3;border-radius:6px;padding:6px 0;min-width:230px;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:5;}
  .resource-menu > div.item{padding:8px 14px;font-size:12.5px;color:#1B2333;cursor:pointer;}
  .resource-menu > div.item:hover{background:#f2f2f2;}
  .topwrap{position:relative;}
  .mayanote{background:var(--navy);color:#fff;font-size:12px;padding:10px 20px;line-height:1.5;}
  .endcallwrap{display:flex;justify-content:center;padding-bottom:4px;}
  .endcall-orange{background:var(--orange);color:#fff;border:1px solid var(--orange);border-radius:4px;padding:5px 16px;font-size:11.5px;cursor:pointer;font-weight:500;}
  .ahtwarn{color:#FFD9A0;font-size:10.5px;margin-top:2px;}
  .wrapupbox{border:1px solid #C7CCD3;border-radius:6px;padding:18px 22px;max-width:600px;}
  .wrapupbox select, .wrapupbox textarea{width:100%;padding:7px 8px;border:1px solid #C7CCD3;border-radius:4px;font-size:12.5px;font-family:inherit;margin-top:4px;margin-bottom:10px;}
  .wrapupbox textarea{min-height:60px;resize:vertical;}
  .missedbanner{background:var(--red-bg);color:var(--red);border-radius:6px;padding:8px 12px;font-size:12px;margin-bottom:10px;}
  .ic.onhold .circ{background:#fff;color:var(--navy);}
  .concernline{font-size:12px;color:#5B6472;margin-bottom:12px;}

  /* --- call transcript panel --- */
  .callpanel{border:1px solid #C7CCD3;border-radius:6px;padding:14px 16px;margin-bottom:16px;background:#FAFBFC;}
  .callpanel .callmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .callpanel .callmeta b{font-size:12.5px;}
  .callpanel .callmeta span.badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--navy);color:#fff;}
  .transcript{max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px;}
  .msg{max-width:82%;padding:8px 12px;border-radius:10px;font-size:12.5px;line-height:1.4;}
  .msg.system{align-self:center;background:#E9EBEF;color:#4A5361;font-size:11px;font-style:italic;max-width:100%;text-align:center;}
  .msg.customer{align-self:flex-start;background:#EDEFF2;color:#1B2333;border-bottom-left-radius:2px;}
  .msg.csa{align-self:flex-end;background:var(--orange);color:#fff;border-bottom-right-radius:2px;}
  .chatinputrow{display:flex;gap:8px;margin-top:10px;}
  .chatinputrow input{flex:1;padding:9px 12px;border:1px solid #C7CCD3;border-radius:4px;font-size:12.5px;}
  .moodline{font-size:11px;color:#5B6472;margin-top:6px;}
  .mic-btn{font-size:15px;padding:8px 12px;line-height:1;}
  .mic-btn.listening{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite;}
  .listening-indicator{font-size:11px;color:var(--red);margin-top:6px;font-weight:600;}

  /* --- modal --- */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,30,38,.55);z-index:50;align-items:center;justify-content:center;padding:20px;}
  .modal-box{background:#fff;border-radius:8px;max-width:560px;width:100%;max-height:82vh;overflow-y:auto;padding:22px 26px;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  .modal-box h3{margin:0 0 12px;font-size:15px;color:var(--navy);}
  .modal-close{position:absolute;top:12px;right:14px;cursor:pointer;font-size:18px;color:#5B6472;background:none;border:none;}
  .modal-box label{font-size:12px;font-weight:600;color:#5B6472;display:block;margin-top:10px;}
  .modal-box input[type=text], .modal-box textarea{width:100%;padding:8px 10px;border:1px solid #C7CCD3;border-radius:4px;font-size:12.5px;font-family:inherit;margin-top:4px;}
  .modal-box textarea{min-height:80px;resize:vertical;}
  .photobox{width:100%;height:150px;background:#F0F1F3;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#5B6472;font-size:12px;margin-top:8px;}
  .mapgraphic{width:100%;border-radius:6px;background:#EAF1F0;margin-top:8px;}
  .statuseventlist{margin-top:10px;}
  .statuseventlist div.ev{font-size:12px;padding:5px 0;border-bottom:1px solid #F0F1F3;color:#333;}

  /* --- DART panel --- */
  .dart-panel{background:#fff;border:1px solid #C7CCD3;border-radius:6px;padding:12px 14px;margin-top:4px;}
  .dart-panel label{font-size:11px;font-weight:600;color:#5B6472;display:block;margin-top:8px;}
  .dart-panel input, .dart-panel textarea{width:100%;padding:7px 9px;border:1px solid #C7CCD3;border-radius:4px;font-size:12px;font-family:inherit;margin-top:3px;}
  .dart-panel textarea{min-height:56px;resize:vertical;}
  .dart-summary{background:var(--green-bg);border:1px solid #A9DFC3;color:#175C3D;border-radius:4px;padding:8px 10px;font-size:11.5px;margin-top:8px;white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topwrap" id="topbar"></div>
  <div id="mayaNote"></div>
  <div class="stage" id="stage"></div>

</div>

<script>
/* =====================  DATA  ===================== */

const customerBase = { name:"Mae Nugent", email:"mnugent", initials:"MN", accountStatus:"active" };

const products = [
  {id:1,name:"Bruno Marc Oxfords Formal Dress Shoes",status:"pending",orderDate:"Monday, March 24",price:"$54.99",orderNumber:"123-4567890-1234567",
    addr:"123 First Street, Kent, WA 98042", tracking:"TBA876736735437",
    steps:[["Ordered, Monday, March 24","",true],["Shipped, Monday, March 24","",true],["Out for delivery","Kent, US",false]],
    updates:[["Monday, March 24","Package has shipped"],["Tuesday, March 25","Package arrived at Amazon facility, Kent, WASHINGTON, US 8:51 PM"],["Wednesday, March 26","Out for delivery, Kent, US - 8:30 AM"]],
    itemDetails:"Size: 10.5 &middot; Color: Black &middot; Condition: New"},
  {id:2,name:"Bose QuietComfort Headphones",status:"delivered",orderDate:"Thursday, February 6",price:"$279.00",orderNumber:"114-2039485-7765432",
    addr:"123 First Street, Kent, WA 98042", tracking:"TBA192837465102",
    steps:[["Ordered, Thursday, February 6","",true],["Shipped, Friday, February 7","",true],["Delivered, Monday, February 10","Kent, US",true]],
    updates:[["Friday, February 7","Package has shipped"],["Saturday, February 8","Package arrived at Amazon facility, Kent, WASHINGTON, US 6:40 PM"],["Monday, February 10","Delivered, Kent, US - 2:15 PM"]],
    itemDetails:"Color: Black &middot; Condition: New"},
  {id:3,name:"Ninja Professional Blender 1000W",status:"delivered",orderDate:"Tuesday, March 18",price:"$89.99",orderNumber:"108-5566778-9988776",
    addr:"123 First Street, Kent, WA 98042", tracking:"TBA334455667788",
    steps:[["Ordered, Tuesday, March 18","",true],["Shipped, Wednesday, March 19","",true],["Delivered, Friday, March 21","Kent, US",true]],
    updates:[["Wednesday, March 19","Package has shipped"],["Thursday, March 20","Package arrived at Amazon facility, Kent, WASHINGTON, US 5:10 PM"],["Friday, March 21","Delivered, Kent, US - 11:05 AM"]],
    itemDetails:"Color: Silver &middot; Condition: New"},
  {id:4,name:"Samsung 55-inch 4K Smart TV",status:"pending",orderDate:"Sunday, March 9",price:"$498.00",orderNumber:"109-3344556-6677889",
    addr:"123 First Street, Kent, WA 98042", tracking:"TBA998877665544",
    steps:[["Ordered, Sunday, March 9","",true],["Shipped, Monday, March 10","",false],["Out for delivery","",false]],
    updates:[["Sunday, March 9","Order placed, preparing for shipment"]],
    itemDetails:"Screen size: 55&quot; &middot; Condition: New"},
  {id:5,name:"Instant Pot Duo 6 Qt",status:"delivered",orderDate:"Friday, January 17",price:"$79.95",orderNumber:"116-8899001-2233445",
    addr:"123 First Street, Kent, WA 98042", tracking:"TBA112233445566",
    steps:[["Ordered, Friday, January 17","",true],["Shipped, Saturday, January 18","",true],["Delivered, Tuesday, January 21","Kent, US",true]],
    updates:[["Saturday, January 18","Package has shipped"],["Sunday, January 19","Package arrived at Amazon facility, Kent, WASHINGTON, US 4:25 PM"],["Tuesday, January 21","Delivered, Kent, US - 9:40 AM"]],
    itemDetails:"Size: 6 Qt &middot; Condition: New"},
  {id:6,name:"Logitech MX Master Mouse",status:"delivered",orderDate:"Wednesday, February 26",price:"$99.99",orderNumber:"121-6655443-3221100",
    addr:"123 First Street, Kent, WA 98042", tracking:"TBA667788990011",
    updates:[["Thursday, February 27","Package has shipped"],["Friday, February 28","Package arrived at Amazon facility, Kent, WASHINGTON, US 3:05 PM"],["Saturday, March 1","Delivered, Kent, US - 10:20 AM"]],
    itemDetails:"Color: Graphite &middot; Condition: New",
    steps:[["Ordered, Wednesday, February 26","",true],["Shipped, Thursday, February 27","",true],["Delivered, Saturday, March 1","Kent, US",true]]}
];
function findProduct(id){ return products.find(p=>p.id===id); }

/* scenario library, weighted so common WISMO / not-received / damaged / wrong-item /
   missing-item scenarios come up most often, delivery/return/refund questions come up
   sometimes, and rarer concerns show up occasionally. */
const scenarioDefs = [
  {key:"wismo1",   weight:5, productId:1, isPrime:true,  sic:"Delivery - Order Status",        issueHint:"transit",   concern:"my package hasn't shown up and it's past the delivery date"},
  {key:"wismo2",   weight:5, productId:4, isPrime:false, sic:"Delivery - Order Status",        issueHint:"transit",   concern:"my order still says it hasn't shipped yet"},
  {key:"notrecv1", weight:5, productId:2, isPrime:true,  sic:"Delivery - Not Received",         issueHint:"notrecv",   concern:"the tracking says delivered but I never got the package"},
  {key:"notrecv2", weight:4, productId:5, isPrime:false, sic:"Delivery - Not Received",         issueHint:"notrecv",   concern:"it shows delivered yesterday but there's nothing at my door"},
  {key:"damaged1", weight:4, productId:3, isPrime:true,  sic:"Damaged Product - Replacement/Refund", issueHint:"damaged", concern:"the item arrived damaged"},
  {key:"damaged2", weight:4, productId:6, isPrime:false, sic:"Damaged Product - Replacement/Refund", issueHint:"damaged", concern:"what I got is broken"},
  {key:"wrong1",   weight:3, productId:6, isPrime:true,  sic:"Wrong Item Received",             issueHint:"wrong",     concern:"I received the wrong item entirely"},
  {key:"missing1", weight:3, productId:5, isPrime:false, sic:"Missing Item From Package",       issueHint:"missing",   concern:"part of what I ordered wasn't in the box"},
  {key:"return1",  weight:2, productId:1, isPrime:true,  sic:"Return - General",                issueHint:"return",    concern:"I need to return this item"},
  {key:"refundq1", weight:2, productId:4, isPrime:false, sic:"Refund Question",                 issueHint:"refundq",   concern:"I'm confused about how my refund is supposed to work"},
  {key:"rare1",    weight:1, productId:2, isPrime:true,  sic:"Billing Question",                issueHint:"billing",   concern:"there's a charge on my account I don't recognize"}
];
const scenarioPool = [];
scenarioDefs.forEach(s=>{ for(let i=0;i<s.weight;i++) scenarioPool.push(s); });
function pickScenario(){ return scenarioPool[Math.floor(Math.random()*scenarioPool.length)]; }

/* mood levels: 0 polite, 1 confused, 2 impatient, 3 frustrated (weighted toward calmer) */
const moodPool = [0,0,0,1,1,2,3];
function pickMood(){ return moodPool[Math.floor(Math.random()*moodPool.length)]; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function moodName(l){ return ["polite","confused","impatient","frustrated"][l]; }

function lastEvent(product){
  const u = product.updates && product.updates.length ? product.updates[product.updates.length-1] : null;
  return u ? (u[0] + " - " + u[1]) : "no recent tracking update";
}

function openerCore(scenario, product){
  const base = "Hi, " + scenario.concern + ".";
  return base;
}
function moodWrap(level, core){
  const templates = [
    ["Hi there, sorry to bother you \u2014 "+core+" Whenever you get a chance, no rush at all.",
     "Hello, hope you're doing well. "+core+" I was hoping you could help me out."],
    ["Um, hi\u2026 I'm not totally sure what's going on but "+core+" Can you help me understand?",
     "Hi, so, "+core+" I honestly don't really get what happened."],
    ["Hi, yeah so "+core+" I really need this sorted out fairly quickly.",
     "Hey, "+core+" I've already been waiting a while on this."],
    ["Hi. Look, "+core+" This is honestly pretty frustrating already.",
     "Hi, "+core+" I'm losing patience with this, to be honest."]
  ];
  return pick(templates[level]);
}

function scenarioFacts(scenario, product){
  const facts = [];
  facts.push("My order number is " + product.orderNumber + ".");
  facts.push("It's the " + product.name + ".");
  facts.push(scenario.isPrime
    ? "I have Prime, so I expected it a lot faster than this."
    : "I placed this order about a week ago.");
  facts.push(product.status === "delivered"
    ? "Tracking shows: " + lastEvent(product) + "."
    : "Tracking still hasn't shown it out for delivery.");
  facts.push("Could you tell me what's going on and what happens next?");
  return facts;
}

function extraStatusEvents(scenario){
  switch(scenario.issueHint){
    case "transit":  return ["Package delayed in transit","Package currently out for delivery"];
    case "notrecv":  return ["Package marked delivered by carrier","Delivery attempted \u2014 left at door/mailroom","Customer reports package not received"];
    case "damaged":  return ["Package delivered","Product reported damaged on arrival"];
    case "wrong":    return ["Package delivered","Incorrect item scanned at fulfillment center"];
    case "missing":  return ["Package delivered","One or more items missing from shipment"];
    case "return":   return ["Return requested by customer","Awaiting drop-off / carrier pickup"];
    default:         return ["Package delivered"];
  }
}

const workTypeMap = {
  transit:"Delivery Investigation", notrecv:"Lost Package Investigation", damaged:"Damaged Product Claim",
  wrong:"Wrong Item Claim", missing:"Missing Item Claim", return:"Return Assistance",
  refundq:"Refund Inquiry", billing:"Billing Inquiry"
};

/* =====================  STATE  ===================== */

let agentStatus = "offline";
let availSeconds = 0, availTimer = null;
let ringSeconds = 20, ringTimer = null;

function pad(n){ return n.toString().padStart(2,"0"); }
function fmt(s){ return pad(Math.floor(s/60))+":"+pad(s%60); }

/* =====================  SPEECH OUTPUT (diverse customer voices)  ===================== */

let cachedVoices = [];
function loadVoices(){
  if(!window.speechSynthesis) return;
  cachedVoices = window.speechSynthesis.getVoices();
}
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function englishVoices(){
  // Prefer actual distinct local/remote English voices, not just the default.
  return (cachedVoices||[]).filter(v=>v.lang && v.lang.startsWith("en"));
}
function pickDiverseVoiceIndex(){
  const list = englishVoices();
  if(!list.length) return 0;
  if(list.length===1) return 0;
  let idx;
  do{ idx = Math.floor(Math.random()*list.length); }while(idx===lastVoiceIdx && list.length>1);
  lastVoiceIdx = idx;
  return idx;
}
function pickVoiceByIndex(idx){
  const list = englishVoices();
  if(!list.length) return null;
  return list[idx % list.length];
}
function pickSystemVoice(){
  if(!cachedVoices || !cachedVoices.length) return null;
  const preferredNames = ["Google US English","Samantha","Microsoft Aria Online (Natural)","Microsoft Jenny Online (Natural)","Karen","Victoria"];
  for(const name of preferredNames){
    const match = cachedVoices.find(v=>v.name.includes(name));
    if(match) return match;
  }
  return englishVoices()[0] || cachedVoices[0];
}
function speakSystem(text){ speakWith(text, pickSystemVoice(), 0.98, 1.0, false); }
function speakCustomer(text){
  if(!callCtx) { speakWith(text, pickSystemVoice(), 1, 1, false); return; }
  const level = callCtx.mood;
  const rate  = clamp(callCtx.baseRate  + [-0.03, 0, 0.06, 0.13][level], 0.75, 1.35);
  const pitch = clamp(callCtx.basePitch + [-0.02, 0.04, 0.08, 0.14][level], 0.7, 1.5);
  speakWith(text, pickVoiceByIndex(callCtx.voiceIdx), rate, pitch, true);
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

/* No sound effect of any kind is attached to message bubbles appearing in the
   transcript \u2014 the only audio is the ringing tone (while ringing) and the
   spoken voice lines below. */
function speakWith(text, voice, rate, pitch, isCustomerLine){
  if(!window.speechSynthesis){
    // No speech synthesis available in this browser \u2014 fall back to auto-listening
    // immediately so the flow still feels interactive via typed/voice input.
    if(isCustomerLine) maybeAutoListen();
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(voice) u.voice = voice;
    u.rate = rate; u.pitch = pitch;
    isSpeaking = true;
    u.onend = ()=>{ isSpeaking = false; if(isCustomerLine) maybeAutoListen(); };
    u.onerror = ()=>{ isSpeaking = false; if(isCustomerLine) maybeAutoListen(); };
    window.speechSynthesis.speak(u);
  }catch(e){
    isSpeaking = false;
    if(isCustomerLine) maybeAutoListen();
  }
}

/* =====================  SPEECH INPUT (voice recognition, hands-free reply)  ===================== */

function speechRecognitionSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

/* Checks the things that silently break voice input:
   - browser support
   - secure context (mic access is blocked on plain file:// / http:// pages) */
function voiceEnvironmentIssue(){
  if(!speechRecognitionSupported()){
    return "Voice recognition isn't supported in this browser. Try Chrome or Edge, or use the text box.";
  }
  if(location.protocol === "file:"){
    return "This page is open as a local file (file://). Browsers block the microphone on local files \u2014 voice replies need it served over https:// or http://localhost. Run e.g. \u2018python3 -m http.server\u2019 in this file's folder and open http://localhost:8000 instead, or just type your replies below.";
  }
  if(window.isSecureContext === false){
    return "Microphone access needs a secure connection (https:// or localhost). Voice input is disabled here \u2014 please type your replies.";
  }
  return null;
}

function noteVoiceIssue(text){
  if(voiceUnsupportedNoted) return;
  voiceUnsupportedNoted = true;
  voiceModeOn = false;
  transcript.push({who:"system", text: text});
  renderStage();
}

function maybeAutoListen(){
  if(!voiceModeOn) return;
  if(agentStatus!=="oncall") return;
  if(voiceEnvironmentIssue()) return;
  setTimeout(()=>{ if(voiceModeOn && agentStatus==="oncall" && !isSpeaking) startListening(); }, 350);
}

function startListening(){
  const issue = voiceEnvironmentIssue();
  if(issue){ noteVoiceIssue(issue); return; }
  if(isListening || isSpeaking) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  isListening = true;
  updateMicUI();
  recognition.onresult = (e)=>{
    const said = e.results[0][0].transcript;
    const input = document.getElementById("chatInput");
    if(input) input.value = said;
    sendChat();
  };
  recognition.onerror = (e)=>{
    isListening = false;
    updateMicUI();
    handleRecognitionError(e.error);
  };
  recognition.onend = ()=>{ isListening = false; updateMicUI(); };
  try{ recognition.start(); }
  catch(e){ isListening = false; updateMicUI(); handleRecognitionError("start-failed"); }
}

function handleRecognitionError(err){
  // no-speech just means it timed out waiting \u2014 not worth interrupting the call for.
  if(err === "no-speech" || err === "aborted") return;
  const messages = {
    "not-allowed": "Microphone access was blocked or denied. Click the mic/lock icon in your browser's address bar, allow the microphone for this page, then try the mic button again.",
    "service-not-allowed": "Microphone access was blocked or denied. Click the mic/lock icon in your browser's address bar, allow the microphone for this page, then try the mic button again.",
    "audio-capture": "No microphone was found. Check that a microphone is connected and not in use by another app.",
    "network": "Voice recognition needs an internet connection to reach the speech service, and it just failed. Check your connection or type your reply instead.",
    "start-failed": "Couldn't start the microphone. Try clicking the mic button directly, or type your reply instead."
  };
  const text = messages[err] || ("Voice input stopped (" + err + "). You can keep typing your replies.");
  transcript.push({who:"system", text: text});
  voiceModeOn = false;
  renderStage();
}

function stopListening(){
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  isListening = false;
  updateMicUI();
}

function toggleMic(){
  if(isListening){ stopListening(); return; }
  const issue = voiceEnvironmentIssue();
  if(issue){ noteVoiceIssue(issue); return; }
  startListening();
}

function toggleVoiceMode(){
  voiceModeOn = !voiceModeOn;
  if(!voiceModeOn) stopListening();
  else voiceUnsupportedNoted = false;
  renderStage();
}

function updateMicUI(){
  const micBtn = document.getElementById("micBtn");
  const ind = document.getElementById("listenInd");
  if(micBtn) micBtn.classList.toggle("listening", isListening);
  if(ind) ind.classList.toggle("hidden", !isListening);
}

/* =====================  RINGING SOUND  ===================== */

let audioCtx = null, ringInterval = null;
function ensureAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  return audioCtx;
}
function playRingBeep(){
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  const now = ctx.currentTime;
  [0,0.4].forEach(offset=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.0001, now+offset);
    gain.gain.linearRampToValueAtTime(0.18, now+offset+0.03);
    gain.gain.linearRampToValueAtTime(0.0001, now+offset+0.35);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now+offset);
    osc.stop(now+offset+0.36);
  });
}
function startRingTone(){
  ensureAudioCtx();
  playRingBeep();
  clearInterval(ringInterval);
  ringInterval = setInterval(playRingBeep, 2000);
}
function stopRingTone(){
  clearInterval(ringInterval);
  ringInterval = null;
}

/* =====================  CALL LIFECYCLE  ===================== */

function clearAllTimers(){
  clearInterval(availTimer); clearInterval(ringTimer); clearInterval(ahtTimer); clearInterval(wrapTimer);
}

function goOffline(){
  clearAllTimers(); stopRingTone(); stopListening();
  agentStatus = "offline";
  availSeconds = 0; ringSeconds = 20; ahtSeconds = 0; wrapSeconds = 120;
  ahtWarned = false; doneClicked = false; resourcesOpen = false; dartOpen = false;
  currentScenario = null; callCtx = null; transcript = [];
  searchDone = false; verified = false; selectedProduct = null; showFindMore = false;
  actionMode = null; issueSelected = null; resolutionSelected = null;
  onHold = false;
  document.getElementById("mayaNote").innerHTML = "";
  render();
}

function goAvailable(){
  clearInterval(ringTimer); clearInterval(ahtTimer); clearInterval(wrapTimer); stopRingTone();
  agentStatus = "available";
  availSeconds = 0;
  clearInterval(availTimer);
  availTimer = setInterval(()=>{ availSeconds++; updateTimerDisplay("availTimerDisplay", fmt(availSeconds)); }, 1000);
  searchDone = false; verified = false; selectedProduct = null; showFindMore = false; doneClicked = false;
  actionMode = null; issueSelected = null; resolutionSelected = null;
  onHold = false;
  render();
  setTimeout(()=>{ if(agentStatus==="available") startRinging(); }, 2000);
}

function setRestingStatus(label){
  clearInterval(ringTimer); stopRingTone();
  agentStatus = label;
  render();
}

function startRinging(){
  if(agentStatus!=="available") return;
  currentScenario = pickScenario();
  agentStatus = "ringing";
  ringSeconds = 20;
  clearInterval(ringTimer);
  render();
  startRingTone();
  ringTimer = setInterval(()=>{
    ringSeconds--;
    updateTimerDisplay("ringCountdown", ringSeconds+" secs");
    if(ringSeconds<=0){
      clearInterval(ringTimer);
      stopRingTone();
      missedCall();
    }
  }, 1000);
}

function missedCall(){
  agentStatus = "available";
  const stage = document.getElementById("stage");
  renderTopbar();
  stage.innerHTML = `<div class="missedbanner">Missed call</div>`;
  setTimeout(()=>{ if(agentStatus==="available") startRinging(); }, 1400);
}

function acceptCall(){
  clearInterval(ringTimer);
  stopRingTone();
  agentStatus = "oncall";
  doneClicked = false;
  onHold = false;
  actionMode = null; issueSelected = null; resolutionSelected = null;
  ahtSeconds = 0; ahtWarned = false;
  clearInterval(ahtTimer);
  ahtTimer = setInterval(()=>{
    ahtSeconds++;
    updateTimerDisplay("ahtTimerDisplay", fmt(ahtSeconds));
    if(ahtSeconds>=480 && !ahtWarned){
      ahtWarned = true;
      const w = document.getElementById("ahtWarnLine");
      if(w) w.classList.remove("hidden");
    }
  }, 1000);

  const product = findProduct(currentScenario.productId);
  callCtx = {
    scenario: currentScenario,
    product,
    mood: pickMood(),
    facts: scenarioFacts(currentScenario, product),
    factIndex: 0,
    noProgress: 0,
    voiceIdx: pickDiverseVoiceIndex(),
    basePitch: 0.85 + Math.random()*0.4,
    baseRate: 0.92 + Math.random()*0.22
  };
  transcript = [];
  voiceUnsupportedNoted = false;
  render();
  runCallOpening();
}

function runCallOpening(){
  const primeLabel = callCtx.scenario.isPrime ? "Prime Member" : "Non-Prime Member";
  transcript.push({who:"system", text:"Connecting call \u2014 "+primeLabel});
  renderStage();
  speakSystem(primeLabel + ".");
  setTimeout(()=>{
    if(agentStatus!=="oncall") return;
    const opening = moodWrap(callCtx.mood, openerCore(callCtx.scenario, callCtx.product));
    transcript.push({who:"customer", text:opening});
    renderStage();
    speakCustomer(opening);
  }, 1600);
}

function clickDone(){
  doneClicked = true;
  renderTopbar();
}

function toggleHold(){
  onHold = !onHold;
  if(onHold){
    clearInterval(ahtTimer);
  } else {
    ahtTimer = setInterval(()=>{
      ahtSeconds++;
      updateTimerDisplay("ahtTimerDisplay", fmt(ahtSeconds));
      if(ahtSeconds>=480 && !ahtWarned){
        ahtWarned = true;
        const w = document.getElementById("ahtWarnLine");
        if(w) w.classList.remove("hidden");
      }
    }, 1000);
  }
  renderTopbar();
}

function endCallInteraction(message){
  clearAllTimers(); stopRingTone(); stopListening();
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  agentStatus = "available";
  searchDone = false; verified = false; selectedProduct = null; showFindMore = false; doneClicked = false; onHold = false;
  actionMode = null; issueSelected = null; resolutionSelected = null;
  document.getElementById("mayaNote").innerHTML = "";
  render();
  document.getElementById("stage").innerHTML = `<div class="missedbanner">${message}</div>`;
  availTimer = setInterval(()=>{ availSeconds++; updateTimerDisplay("availTimerDisplay", fmt(availSeconds)); }, 1000);
  setTimeout(()=>{
    if(agentStatus==="available"){
      document.getElementById("stage").innerHTML = "";
      startRinging();
    }
  }, 1400);
}

function simulateTransfer(){ endCallInteraction("Call transferred to another representative."); }
function simulateBlock(){ endCallInteraction("Customer blocked."); }

function clickEndCall(){
  clearInterval(ahtTimer);
  stopListening();
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  agentStatus = "wrapup";
  wrapSeconds = 120;
  clearInterval(wrapTimer);
  render();
  wrapTimer = setInterval(()=>{
    wrapSeconds--;
    updateTimerDisplay("wrapCountdown", fmt(wrapSeconds));
    if(wrapSeconds<=0){
      clearInterval(wrapTimer);
      finishWrapup();
    }
  }, 1000);
}

function finishWrapup(){
  clearInterval(wrapTimer);
  if(agentStatus==="wrapup" || agentStatus==="oncall"){
    agentStatus = "available";
    searchDone=false; verified=false; selectedProduct=null; showFindMore=false; doneClicked=false;
    actionMode=null; issueSelected=null; resolutionSelected=null;
    dartOpen=false; dartText=""; dartSubmitted=null;
    render();
    setTimeout(()=>{ if(agentStatus==="available") startRinging(); }, 1200);
  }
}

function toggleResources(){
  resourcesOpen = !resourcesOpen;
  renderTopbar();
}

function toggleDart(){
  dartOpen = !dartOpen;
  renderTopbar();
}

/* =====================  CONVERSATION RULE ENGINE  ===================== */

const moodFallback = [
  ["Okay, thank you for checking on that.","Take your time, I appreciate the help.","Alright, that sounds good to me."],
  ["Sorry, I don't quite follow \u2014 could you explain that?","Wait, what does that mean for my order?","I'm a little confused, could you clarify?"],
  ["Okay, but how long is this going to take?","I really need this resolved soon.","Is there a faster way to handle this?"],
  ["This is honestly really frustrating, I've already waited too long.","I just want this fixed, please.","Honestly, this isn't good enough so far."]
];

function downgradeMood(){ callCtx.mood = Math.max(0, callCtx.mood-1); }
function upgradeMood(){ callCtx.mood = Math.min(3, callCtx.mood+1); }

function customerReply(msg){
  const t = msg.toLowerCase();
  const p = callCtx.product;
  let matched = true;

  if(/(your|customer'?s?|account) name|may i (know|have) your name|who am i speaking (with|to)|can i get your name/.test(t)){
    return customerBase.name.split(" ")[0] + ". " + customerBase.name + ", actually.";
  }
  if(/order (number|id)/.test(t)){
    return "Sure, it's " + p.orderNumber + ".";
  }
  if(/(verify|confirm).*(account|identity)|approve.*request|sent.*(request|text|email)/.test(t)){
    return "Okay, I think I just got a notification \u2014 let me check\u2026 alright, I approved it.";
  }
  else if(/sorry|apologize|understand (your|the) frustrat|i (hear|get) you/.test(t)){
    downgradeMood();
    return pick(["Thank you, I appreciate that.","Okay, that helps, thank you for saying that."]);
  }
  else if(/refund/.test(t)){
    downgradeMood();
    return pick(["A refund would work for me, thank you.","Okay, a refund sounds fair."]);
  }
  else if(/replace(ment)?/.test(t)){
    downgradeMood();
    return pick(["A replacement would be great, thank you.","Sure, sending a new one works for me."]);
  }
  else if(/hold|one moment|give me a (sec|second|minute)|bear with/.test(t)){
    return pick(["Okay, I'll wait.","Sure, take your time."]);
  }
  else if(/when|how long|eta|timeline|what happens next/.test(t)){
    return p.status==="delivered"
      ? "So if it's already marked delivered, what happens now?"
      : "Do you have an idea of when it'll actually arrive?";
  }
  else if(/how (can|may) i help|what can i (help|do)|what.?s (going on|the issue)|what happened|what.?s wrong/.test(t)){
    return callCtx.scenario.concern.charAt(0).toUpperCase()+callCtx.scenario.concern.slice(1)+".";
  }
  else{
    matched = false;
  }

  if(matched){
    callCtx.noProgress = 0;
    return null; // handled above already returned; placeholder, unreachable
  }

  // progressive fact reveal
  if(callCtx.factIndex < callCtx.facts.length){
    callCtx.noProgress = 0;
    return callCtx.facts[callCtx.factIndex++];
  }

  // no new info and nothing matched -> may escalate mood
  callCtx.noProgress++;
  if(callCtx.noProgress>=3){
    upgradeMood();
    callCtx.noProgress = 0;
  }
  return pick(moodFallback[callCtx.mood]);
}

function sendChat(){
  const input = document.getElementById("chatInput");
  if(!input) return;
  const val = input.value.trim();
  if(!val || !callCtx) return;
  stopListening();
  transcript.push({who:"csa", text:val});
  const reply = customerReply(val);
  if(reply){
    transcript.push({who:"customer", text:reply});
  }
  input.value = "";
  renderStage();
  const speakText = reply;
  if(speakText) speakCustomer(speakText);
  const refocus = document.getElementById("chatInput");
  if(refocus) refocus.focus();
  scrollTranscriptBottom();
}

function customerReact(line){
  if(!callCtx) return;
  transcript.push({who:"customer", text:line});
  speakCustomer(line);
}

function scrollTranscriptBottom(){
  const box = document.getElementById("transcriptBox");
  if(box) box.scrollTop = box.scrollHeight;
}

function updateTimerDisplay(id, text){
  const el = document.getElementById(id);
  if(el) el.textContent = text;
}

function maskEmail(local){
  if(local.length<=2) return local+"***@email.com";
  return local[0]+"*".repeat(Math.max(local.length-2,3))+local.slice(-2)+"@email.com";
}

function render(){
  renderTopbar();
  renderStage();
}

  const sc = currentScenario;
  const workType = sc ? (workTypeMap[sc.issueHint] || sc.sic) : "";
  const orderNum = selectedProduct ? selectedProduct.orderNumber : (sc ? findProduct(sc.productId).orderNumber : "");
  return `
    <div class="dart-panel" id="dartPanel">
      <b style="font-size:12.5px;">Contacting DART</b>
      <label>Work Type</label>
      <input type="text" id="dartWorkType" value="${workType}">
      <label>Order Number</label>
      <input type="text" id="dartOrderNumber" value="${orderNum}">

function bindDartPanel(){
  if(!dartOpen) return;
  const submitBtn = document.getElementById("dartSubmitBtn");
  const concernBox = document.getElementById("dartConcern");
  if(concernBox){
    concernBox.addEventListener("input", ()=>{ dartText = concernBox.value; });

      const on = document.getElementById("dartOrderNumber").value;

            </div>
            <div class="ic ${onHold?'onhold':''}" id="holdBtn" style="display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#fff;cursor:pointer;"><div class="circ">&#10073;&#10073;</div>${onHold?'Resume':'Hold'}</div>
            <div class="ic" id="transferBtn" style="display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#fff;cursor:pointer;"><div class="circ">&#8646;</div>Transfer</div>
            <div class="ic" id="blockBtn" style="display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#fff;cursor:pointer;"><div class="circ">&#9940;</div>Block</div>
          </div>
          <span class="ahtwarn hidden" id="ahtWarnLine">AHT exceeded - continue call</span>
          ${doneClicked ? `<div class="endcallwrap"><button class="endcall-orange" id="endCallBtn">End Call</button></div>` : ""}
        </div>
        ${resourceBtn}
      </div>
      ${resourceMenu}`;
    document.getElementById("doneBtn").addEventListener("click", clickDone);
    document.getElementById("holdBtn").addEventListener("click", toggleHold);
    document.getElementById("transferBtn").addEventListener("click", simulateTransfer);
    document.getElementById("blockBtn").addEventListener("click", simulateBlock);
    document.getElementById("resourceBtn").addEventListener("click", toggleResources);
    if(doneClicked){ document.getElementById("endCallBtn").addEventListener("click", clickEndCall); }
    if(ahtWarned){ document.getElementById("ahtWarnLine").classList.remove("hidden"); }
  } else if(agentStatus==="wrapup"){
    top.innerHTML = `
      <div class="bar">
        <div class="left">
          <div class="statusbox"><span class="dot"></span><span>Wrap up</span><span class="timer" id="wrapCountdown">${fmt(wrapSeconds)}</span></div>
        </div>
        ${resourceBtn}
      </div>
      ${resourceMenu}`;
    document.getElementById("resourceBtn").addEventListener("click", toggleResources);
  }

  const resetBtn = document.getElementById("resetPracticeBtn");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{ resourcesOpen = false; dartOpen=false; goOffline(); });
  const dartMenuItem = document.getElementById("dartMenuItem");
  if(dartMenuItem) dartMenuItem.addEventListener("click", toggleDart);
  bindDartPanel();
}

function toggleStatusMenu(){
  const menu = document.getElementById("statusMenu");
  menu.classList.toggle("hidden");
  if(!menu.dataset.bound){
    menu.dataset.bound = "1";
    menu.querySelectorAll("div").forEach(d=>{
      d.addEventListener("click", ()=>{
        const a = d.dataset.a;
        menu.classList.add("hidden");
        if(a==="available") goAvailable();
        else if(a==="offline") goOffline();
        else if(a==="break1") setRestingStatus("break1");
        else if(a==="break2") setRestingStatus("break2");
        else if(a==="project") setRestingStatus("projectwork");
      });
    });
  }
}

/* =====================  RENDER: STAGE  ===================== */

function renderStage(){
  const s = document.getElementById("stage");

  if(agentStatus==="wrapup"){
    const sic = currentScenario ? currentScenario.sic : "";
    s.innerHTML = `
      <div class="wrapupbox">
        <label style="font-size:12.5px;font-weight:500;">SIC</label>
        <select id="sicSelect">
          <option ${sic==="Delivery - Order Status"?"selected":""}>Delivery - Order Status</option>
          <option ${sic==="Delivery - Not Received"?"selected":""}>Delivery - Not Received</option>
          <option ${sic==="Damaged Product - Replacement/Refund"?"selected":""}>Damaged Product - Replacement/Refund</option>
          <option ${sic==="Wrong Item Received"?"selected":""}>Wrong Item Received</option>
          <option ${sic==="Missing Item From Package"?"selected":""}>Missing Item From Package</option>
          <option ${sic==="Return - General"?"selected":""}>Return - General</option>
          <option ${sic==="Refund Question"?"selected":""}>Refund Question</option>
          <option ${sic==="Billing Question"?"selected":""}>Billing Question</option>
          <option>Other</option>
        </select>
        <label style="font-size:12.5px;font-weight:500;">Annotation</label>
        <textarea id="annotationBox" placeholder="Summarize the interaction..."></textarea>
        <button class="btn primary" id="completeWrapBtn">Complete wrap-up</button>
      </div>`;
    document.getElementById("completeWrapBtn").addEventListener("click", finishWrapup);
    return;
  }

  if(agentStatus!=="oncall"){
    s.innerHTML = "";
    return;
  }

  const primeLabel = currentScenario.isPrime ? "Prime Member" : "Non-Prime Member";
  const msgsHtml = transcript.map(m=>{
    if(m.who==="system") return `<div class="msg system">${m.text}</div>`;
    return `<div class="msg ${m.who}">${m.text}</div>`;
  }).join("");

  const voiceIssue = voiceEnvironmentIssue();
  const voiceOk = !voiceIssue;
  s.innerHTML = `
    <div class="callpanel">
      <div class="callmeta">
        <b>Live call \u2014 ${customerBase.name}</b>
        <span class="badge">${primeLabel}</span>
      </div>
      <div class="transcript" id="transcriptBox">${msgsHtml}</div>
      <div class="listening-indicator hidden" id="listenInd">&#127908; Listening\u2026 speak your reply</div>
      <div class="chatinputrow">
        <input id="chatInput" type="text" placeholder="${voiceOk && voiceModeOn ? 'Speak, or type here...' : 'Type what you say to the customer...'}">
        <button class="btn mic-btn" id="micBtn" title="${voiceOk ? 'Push to talk' : voiceIssue}">&#127908;</button>
        <button class="btn primary" id="chatSendBtn">Send</button>
      </div>
      <div class="moodline">
        Customer tone: ${moodName(callCtx.mood)}
        ${voiceOk ? `&nbsp;&middot;&nbsp; <span class="link" id="voiceModeToggle">Auto-voice: ${voiceModeOn ? "On" : "Off"}</span>` : `&nbsp;&middot;&nbsp; <span style="color:#B3261E;">Voice input unavailable \u2014 click the mic for why</span>`}
      </div>
    </div>
    <hr class="hr">
    <div id="flowArea"></div>
  `;
  document.getElementById("chatSendBtn").addEventListener("click", sendChat);
  document.getElementById("chatInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); sendChat(); } });
  const micBtn = document.getElementById("micBtn");
  if(micBtn) micBtn.addEventListener("click", toggleMic);
  const voiceToggle = document.getElementById("voiceModeToggle");
  if(voiceToggle) voiceToggle.addEventListener("click", toggleVoiceMode);
  updateMicUI();
  scrollTranscriptBottom();

  renderFlow();
}

function renderFlow(){
  const s = document.getElementById("flowArea");
  if(!s) return;

  if(!searchDone){
    s.innerHTML = `
      <div class="concernline">Customer's concern: ${currentScenario.concern}</div>
      <div class="searchrow">
        <input id="searchInput" type="text" placeholder="Search by email or mobile number">
        <button class="btn primary" id="searchBtn">Search</button>
      </div>
      <div class="link" id="noAcctLink">I don't have an Amazon account</div>
      <div id="resultArea"></div>`;
    document.getElementById("searchBtn").addEventListener("click", doSearch);
  } else if(!verified){
    s.innerHTML = `
      <div class="verifybox">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
          <div style="width:40px;height:40px;border-radius:50%;background:#E9EBEF;"></div>
          <div>
            <b>${customerBase.name}</b><br>
            <span style="font-size:13px;color:var(--muted);">${maskEmail(customerBase.email)}</span><br>
            <span style="font-size:12.5px;">This account is active</span>
          </div>
        </div>
        <p style="font-weight:500;margin:0 0 6px;">Before I can help you, I need to send a request to confirm your account.</p>
        <ul>
          <li>To confirm your account, you only need to approve the request once.</li>
          <li>You should get this request as an email or text message from Amazon.</li>
          <li>If you have the Amazon app installed, you might get an app notification.</li>
        </ul>
        <div id="verifyBanner"></div>
        <div style="display:flex;gap:8px;">
          <button class="btn primary" id="sendReqBtn">Send Request</button>
          <button class="btn" id="verifyTransferBtn">Transfer</button>
        </div>
      </div>`;
    document.getElementById("sendReqBtn").addEventListener("click", sendVerification);
    document.getElementById("verifyTransferBtn").addEventListener("click", simulateTransfer);
  } else if(!selectedProduct){
    s.innerHTML = `
      ${showFindMore ? `<div class="searchrow"><input id="orderSearch" type="text" placeholder="Search by order number or product name"><button class="btn primary" id="orderSearchBtn">Search</button></div>` : ''}
      <div class="prodgrid" id="prodGrid"></div>
      ${!showFindMore ? `<div class="link" id="findMoreLink">Find more</div>` : ''}
    `;
    const grid = document.getElementById("prodGrid");
    products.forEach(p=>{
      const card = document.createElement("div");
      card.className = "prodcard";
      card.innerHTML = `<div class="thumb">Product</div>
        <div class="pname">${p.name}</div>
        <div class="pmeta">Ordered ${p.orderDate} &middot; ${p.price}</div>
        <span class="tag ${p.status}">${p.status==='pending'?'Product pending':'Product delivered'}</span>`;
      card.addEventListener("click", ()=>{
        selectedProduct = p;
        openSections = {delivery:true, payments:false, returns:false, item:false};
        actionMode=null; issueSelected=null; resolutionSelected=null;
        renderStage();
        if(p.id === currentScenario.productId){
          customerReact("Yes, that's the one.");
        }
      });
      grid.appendChild(card);
    });
    if(!showFindMore){
      document.getElementById("findMoreLink").addEventListener("click", ()=>{ showFindMore = true; renderStage(); });
    } else {
      document.getElementById("orderSearchBtn").addEventListener("click", ()=>{ renderStage(); });
    }
  } else {
    renderOrderDetail(s);
  }
}

function renderOrderDetail(s){
  const p = selectedProduct;
  const stepsHtml = p.steps.map(([label,sub,done])=>`
    <div class="trackstep ${done?'done':''}">
      <div class="tdot">${done?'&#10003;':''}</div>
      <div><div class="label">${label}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>
    </div>`).join("");
  const updatesHtml = (p.updates||[]).map(([date,text])=>`
      <div class="u-date">${date}</div>
      <div class="u-text">${text}</div>`).join("");

  let flowHtml = "";
  if(actionMode==="refund"){
    const issues = ["missing","damaged","other"];
    const issueLabels = {missing:"Product Missing", damaged:"Product Damaged/Broken", other:"Other issue"};
    flowHtml += `<div class="issuegrid" style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
      ${issues.map(i=>`<button class="btn ${issueSelected===i?'primary':''}" data-issue="${i}">${issueLabels[i]}</button>`).join("")}
    </div>`;
    if(issueSelected){
      const resolves = ["full","partial","promo"];
      const resolveLabels = {full:"Full Refund", partial:"Partial Refund", promo:"Promotional Certificate"};
      flowHtml += `<div class="resolvegrid" id="resolveGrid">
        ${resolves.map(r=>`<button class="btn ${resolutionSelected===r?'primary':''}" data-r="${r}">${resolveLabels[r]}</button>`).join("")}
      </div>`;
      if(resolutionSelected){
        flowHtml += resolutionOutcomeHtml("refund");
      }
    }
  } else if(actionMode==="replacement"){
    const issues = ["missing","damaged","wrong","other"];
    const issueLabels = {missing:"Product Missing", damaged:"Product Damaged/Broken", wrong:"Wrong Item", other:"Other issue"};
    flowHtml += `<div class="issuegrid" style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
      ${issues.map(i=>`<button class="btn ${issueSelected===i?'primary':''}" data-issue="${i}">${issueLabels[i]}</button>`).join("")}
    </div>`;
    if(issueSelected){
      const resolves = ["send","expedited","promo"];
      const resolveLabels = {send:"Send Replacement", expedited:"Expedited Replacement", promo:"Promotional Certificate"};
      flowHtml += `<div class="resolvegrid" id="resolveGrid">
        ${resolves.map(r=>`<button class="btn ${resolutionSelected===r?'primary':''}" data-r="${r}">${resolveLabels[r]}</button>`).join("")}
      </div>`;
      if(resolutionSelected){
        flowHtml += resolutionOutcomeHtml("replacement");
      }
    }
  }

  s.innerHTML = `
    <div class="orderlink">${p.name}</div>
    <div style="font-size:14px;font-weight:700;margin:4px 0 2px;">Ordered ${p.orderDate}</div>

    <div class="sectionhead" id="toggleDelivery"><span class="arrow ${openSections.delivery?'open':''}">&#9654;</span> Delivery status and details</div>
    <div class="sectionbody ${openSections.delivery?'':'hidden'}" id="bodyDelivery">
      <div class="track">${stepsHtml}</div>
      <table class="orderinfo">
        <tr><td class="label">Order number</td><td>${p.orderNumber}</td></tr>
        <tr><td class="label">Order total</td><td>${p.price}</td></tr>
        <tr><td class="label">Shipping address</td><td>${p.addr}</td></tr>
      </table>
      <div class="twocol">
        <div class="col">
          <div class="coltitle">Who's shipping it</div>
          <div class="colrow"><div class="colicon">&#8594;</div><div>Amazon<br>Tracking ID<br>${p.tracking}</div></div>
        </div>
        <div class="col">
          <div class="coltitle">What's in the shipment?</div>
          <div class="colrow"><div class="colicon">&#128230;</div><div>1 of ${p.name}</div></div>
        </div>
      </div>
      <div class="coltitle" style="margin-top:16px;">Shipping updates</div>
      <div class="updates-list">${updatesHtml}</div>
      <div style="margin-top:10px;"><span class="link" id="mapLink">View delivery map &amp; full tracking</span></div>
    </div>

    <hr class="hr">
    <div class="sectionhead" id="togglePayments"><span class="arrow ${openSections.payments?'open':''}">&#9654;</span> Payments and refunds</div>
    <div class="sectionbody ${openSections.payments?'':'hidden'}" id="bodyPayments">
      Payment method: Visa ending in 4821<br>
      Order total: ${p.price}<br>
      No refunds have been issued for this order.
    </div>

    <div class="sectionhead" id="toggleReturns"><span class="arrow ${openSections.returns?'open':''}">&#9654;</span> Return status and details</div>
    <div class="sectionbody ${openSections.returns?'':'hidden'}" id="bodyReturns">
      No return has been initiated for this item.
    </div>

    <div class="sectionhead" id="toggleItem"><span class="arrow ${openSections.item?'open':''}">&#9654;</span> Item details</div>
    <div class="sectionbody ${openSections.item?'':'hidden'}" id="bodyItem">
      ${p.itemDetails}
    </div>

    <div class="actiongrid">
      <button class="btn ${actionMode==='refund'?'primary':''}" id="actRefund">Refund</button>
      <button class="btn ${actionMode==='replacement'?'primary':''}" id="actReplacement">Replacement</button>
      <button class="btn" id="actPhoto">Delivery Photo</button>
      <button class="btn" id="actEmail">Send Email</button>
    </div>
    <div id="actionFlowArea">${flowHtml}</div>
    <div style="margin-top:12px;"><span class="link" id="backToProducts">Back to products</span></div>
  `;

  function bindToggle(headId, bodyId, key){
    document.getElementById(headId).addEventListener("click", ()=>{
      openSections[key] = !openSections[key];
      renderStage();
    });
  }
  bindToggle("toggleDelivery","bodyDelivery","delivery");
  bindToggle("togglePayments","bodyPayments","payments");
  bindToggle("toggleReturns","bodyReturns","returns");
  bindToggle("toggleItem","bodyItem","item");
  document.getElementById("backToProducts").addEventListener("click", ()=>{ selectedProduct=null; renderStage(); });
  document.getElementById("mapLink").addEventListener("click", ()=>openMapModal(p));
  document.getElementById("actRefund").addEventListener("click", ()=>{ actionMode='refund'; issueSelected=null; resolutionSelected=null; renderStage(); });
  document.getElementById("actReplacement").addEventListener("click", ()=>{ actionMode='replacement'; issueSelected=null; resolutionSelected=null; renderStage(); });
  document.getElementById("actPhoto").addEventListener("click", ()=>openPhotoModal(p));
  document.getElementById("actEmail").addEventListener("click", ()=>openEmailModal(p));

  const issueBtns = s.querySelectorAll("[data-issue]");
  issueBtns.forEach(b=>{
    b.addEventListener("click", ()=>{ issueSelected = b.dataset.issue; resolutionSelected=null; renderStage(); });
  });
  const resolveGrid = document.getElementById("resolveGrid");
  if(resolveGrid){
    resolveGrid.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{
        resolutionSelected = b.dataset.r;
        renderStage();
        reactToResolution(resolutionSelected);
      });
    });
  }
}

function resolutionOutcomeHtml(mode){
  if(resolutionSelected==="promo"){
    return `<div class="giftcard">Promotional certificate applied: <b>$5</b> \u2014 redeemable on Amazon.com only.</div>`;
  }
  const labels = mode==="refund"
    ? {full:"Full Refund", partial:"Partial Refund"}
    : {send:"Send Replacement", expedited:"Expedited Replacement"};
  const label = labels[resolutionSelected] || resolutionSelected;
  return `<div class="giftcard">${label} selected for this order.</div>`;
}

function reactToResolution(choice){
  const lines = {
    full: "Okay, a full refund works, thank you.",
    partial: "A partial refund is fine, I appreciate it.",
    promo: "A $5 certificate is fine, thank you for that.",
    send: "Great, thank you for sending a replacement.",
    expedited: "Thank you, I appreciate you expediting that."
  };
  if(lines[choice]){
    downgradeMood();
    customerReact(lines[choice]);
    renderStage();
  }
}

/* =====================  SEARCH / VERIFY  ===================== */

function doSearch(){
  const val = document.getElementById("searchInput").value.trim();
  const area = document.getElementById("resultArea");
  if(!val){
    area.innerHTML = `<div style="color:var(--red);font-size:13px;">Enter an email or phone number first.</div>`;
    return;
  }
  area.innerHTML = `
    <div class="resultcount">Showing 1 of 1 results</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="check" id="checkCircle">&#10003;</div>
      <div class="acctcard" id="acctCardEl" style="flex:1;">
        <div class="circ">${customerBase.initials}</div>
        <div class="info"><b>${customerBase.name}</b><div>${maskEmail(customerBase.email)}</div></div>
        <div class="status-pill">Active</div>
      </div>
    </div>
    <div class="infobox">
      A customer's account may show different statuses. Here are the most common:<br>
      <b>Active</b> - Account is open and being used or ready for use.<br>
      <b>Locked</b> - We have detected unusual activity on this account and have placed the account on hold.<br>
      <b>Oh Hold</b> - Accounts can be placed on hold by Amazon or the customer while investigating suspicious activity.<br>
      <b>Closed</b> - Account has been closed by customer.<br>
      Select the <b>Account Card</b> to continue.
    </div>`;
  document.getElementById("acctCardEl").addEventListener("click", ()=>{
    document.getElementById("acctCardEl").classList.add("selected");
    document.getElementById("checkCircle").style.background = "var(--orange)";
    document.getElementById("checkCircle").style.color = "#fff";
    document.getElementById("checkCircle").style.borderColor = "var(--orange)";
    setTimeout(()=>{ searchDone = true; renderStage(); }, 250);
  });
}

function sendVerification(){
  const banner = document.getElementById("verifyBanner");
  banner.innerHTML = `<div class="banner banner-wait">Verification request sent. Waiting for the customer to approve.</div>`;
  setTimeout(()=>{
    banner.innerHTML = `<div class="banner banner-ok">Customer approved the request. Identity confirmed.</div>`;
    setTimeout(()=>{
      verified = true;
      renderStage();
      customerReact("Okay, I just approved it on my end.");
      renderStage();
    }, 900);
  }, 1400);
}

/* =====================  MODALS  ===================== */

function openModal(html){
  let overlay = document.getElementById("modalOverlay");
  if(!overlay){
    overlay = document.createElement("div");
    overlay.id = "modalOverlay";
    overlay.className = "modal-overlay";
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<div class="modal-box">${html}</div>`;
  overlay.style.display = "flex";
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  const closeBtn = overlay.querySelector(".modal-close");
  if(closeBtn) closeBtn.addEventListener("click", closeModal);
}
function closeModal(){
  const overlay = document.getElementById("modalOverlay");
  if(overlay) overlay.style.display = "none";
}

function openPhotoModal(p){
  const lastUpdate = p.updates && p.updates.length ? p.updates[p.updates.length-1] : null;
  const dateLine = lastUpdate ? lastUpdate[0] : p.orderDate;
  const statusLine = lastUpdate ? lastUpdate[1] : "In progress";
  const hasPhoto = p.status === "delivered";
  openModal(`
    <button class="modal-close">&times;</button>
    <h3>Delivery Photo</h3>
    <table class="orderinfo">
      <tr><td class="label">Delivery location</td><td>${p.addr}</td></tr>
      <tr><td class="label">Delivery date/time</td><td>${dateLine}</td></tr>
      <tr><td class="label">Delivery status</td><td>${statusLine}</td></tr>
    </table>
    <div class="photobox">${hasPhoto ? "Delivery photo (simulated) \u2014 package at front door" : "No delivery photo available yet"}</div>
  `);
}

function openMapModal(p){
  const events = extraStatusEvents(currentScenario);
  const stepsHtml = p.steps.map(([label,sub])=>`<div class="ev"><b>${label}</b>${sub?" \u2014 "+sub:""}</div>`).join("");
  openModal(`
    <button class="modal-close">&times;</button>
    <h3>Delivery Tracking &amp; Map</h3>
    <svg class="mapgraphic" viewBox="0 0 500 140" xmlns="http://www.w3.org/2000/svg">
      <rect width="500" height="140" fill="#EAF1F0"/>
      <path d="M40,100 C150,20 350,120 460,40" stroke="#2557A7" stroke-width="3" fill="none" stroke-dasharray="6,5"/>
      <circle cx="40" cy="100" r="7" fill="#1F8A5E"/>
      <text x="20" y="122" font-size="11" fill="#1B2333">Fulfillment Ctr</text>
      <circle cx="460" cy="40" r="7" fill="#E35B27"/>
      <text x="400" y="30" font-size="11" fill="#1B2333">${p.addr.split(",")[1] ? p.addr.split(",")[1].trim() : "Destination"}</text>
    </svg>
    <div class="coltitle" style="margin-top:12px;">Timeline</div>
    ${stepsHtml}
    <div class="coltitle" style="margin-top:12px;">Additional status details</div>
    <div class="statuseventlist">${events.map(e=>`<div class="ev">${e}</div>`).join("")}</div>
  `);
}

function openEmailModal(p){
  const to = maskEmail(customerBase.email);
  const subject = "Regarding your order " + p.orderNumber;
  const message = "Hi " + customerBase.name.split(" ")[0] + ",\n\nThank you for contacting us about " + currentScenario.concern + " for your order " + p.orderNumber + " (" + p.name + "). We're looking into this and will follow up shortly.\n\nThank you,\nAmazon Customer Service";
  openModal(`
    <button class="modal-close">&times;</button>
    <h3>Send Email (training simulation only)</h3>
    <label>To</label>
    <input type="text" id="emailTo" value="${to}">
    <label>Subject</label>
    <input type="text" id="emailSubject" value="${subject}">
    <label>Message</label>
    <textarea id="emailMessage">${message}</textarea>
    <div style="margin-top:10px;"><button class="btn primary" id="emailSendBtn">Send</button></div>
    <div id="emailSentNote"></div>
  `);
  document.getElementById("emailSendBtn").addEventListener("click", ()=>{
    document.getElementById("emailSentNote").innerHTML = `<div class="giftcard" style="margin-top:10px;">Email sent (simulation only \u2014 no real email was sent).</div>`;
    setTimeout(closeModal, 1400);
  });
}

goOffline();
</script>
</body>
</html>
